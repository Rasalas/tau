<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11110f" />
    <!-- The browser client of a listening host. `blob:` is how an extension
         bundle the host sent as source becomes a module here; the desktop
         window has the host's own `tau-ext:` scheme for that instead. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws: wss:" />
    <!-- The token contract, linked as in index.html so the first paint is themed. -->
    <link rel="stylesheet" href="/src/renderer/tokens.css" />
    <title>Tau</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
