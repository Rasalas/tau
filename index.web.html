<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf8" data-scheme="light" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a19" data-scheme="dark" media="(prefers-color-scheme: dark)" />
    <!-- The browser client of a listening host. `blob:` is how an extension
         bundle the host sent as source becomes a module here; the desktop
         window has the host's own `tau-ext:` scheme for that instead. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws: wss:" />
    <!-- The token contract, linked as in index.html so the first paint is themed. -->
    <link rel="stylesheet" href="/src/renderer/tokens.css" />
    <!-- From src/web/public (scripts/icons/generate.mjs). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tau</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
