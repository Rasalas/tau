<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11110f" />
    <!-- The token contract, linked rather than imported so the first paint is
         already themed. `data-theme` on <html> selects the set; "system" is the
         default and follows the OS through `color-scheme`. -->
    <link rel="stylesheet" href="/src/renderer/tokens.css" />
    <!-- ws:/wss: is the host protocol's socket transport: a window started with
         TAU_HOST_URL or ?host= talks to a host that is not this machine. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' tau-ext:; style-src 'self' 'unsafe-inline' tau-ext:; font-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:5173 ws: wss:" />
    <title>Tau — Pi Desktop Prototype</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
