<!doctype html>
<!-- `data-theme` is the theme preference: system, dark or light. It ships as
     `system` so the OS decides the first paint; the client rewrites it from the
     stored preference before React mounts. -->
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf8" data-scheme="light" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1116" data-scheme="dark" media="(prefers-color-scheme: dark)" />
    <!-- The token contract, linked rather than imported so the first paint is
         already themed. `data-theme` on <html> selects the set; "system" is the
         default and follows the OS through `color-scheme`. -->
    <link rel="stylesheet" href="/src/renderer/tokens.css" />
    <!-- ws:/wss: is the host protocol's socket transport: a window started with
         TAU_HOST_URL or ?host= talks to a host that is not this machine. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' tau-ext:; style-src 'self' 'unsafe-inline' tau-ext:; font-src 'self'; img-src 'self' data: tau-ext:; media-src 'self' tau-ext:; frame-src 'self' tau-ext:; connect-src 'self' http://localhost:5173 ws: wss:" />
    <title>Tau — Pi Desktop Prototype</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
