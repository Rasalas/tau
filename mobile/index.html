<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf8" data-scheme="light" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1116" data-scheme="dark" media="(prefers-color-scheme: dark)" />
    <!-- The page never reaches a host itself: every socket is a native one that
         pins the host's certificate. `blob:` is how a kit bundle the host sent
         as source becomes a module. WebKit's 'self' does not cover the app's
         own scheme, so the origins are named (capacitor: on iOS, https: on Android). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor://localhost https://localhost; script-src 'self' capacitor://localhost https://localhost blob:; style-src 'self' capacitor://localhost https://localhost 'unsafe-inline'; font-src 'self' capacitor://localhost https://localhost; img-src 'self' capacitor://localhost https://localhost data: blob:; connect-src 'self' capacitor://localhost https://localhost" />
    <title>Tau</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
