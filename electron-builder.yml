appId: de.tbuck.tau
productName: Tau
copyright: Copyright © Torben Buck
directories:
  output: release
  buildResources: assets

# The default `**/*` plus exclusions: everything the app needs at runtime lives
# in dist/, dist-electron/ and the production node_modules, and electron-builder
# already prunes devDependencies. Listing the sources to leave out keeps a new
# runtime file from silently going missing.
#
# A leading dot defeats electron-builder's own auto-recursion: it only appends
# `/**/*` to a bare negated pattern when the pattern has no `.` in it, so any
# hidden directory needs that suffix written out or only the directory entry
# itself is excluded, not its contents (electron-builder issue #545 doesn't
# cover this case — a hidden top-level directory always contains a dot).
files:
  - "!.github/**"
  # The Agent SDK's optional platform packages carry a 200 MB copy of the
  # Claude Code binary. Tau drives the user's installed `claude` instead.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  # Agent skills for developing Tau itself (e.g. driving an isolated instance
  # to verify a change) — not something the packaged app runs.
  - "!.agents/**"
  - "!.pi/**"
  - "!.scratch/**"
  # The isolated dev instance (`npm run dev:instance`) keeps its userData here.
  - "!.tau-dev/**"
  - "!benchmarks"
  - "!docs"
  - "!examples"
  # Kit sources; the app loads `dist-kits/`, which the default `**/*` picks up
  # (a positive pattern here would replace that default, not add to it).
  - "!kits"
  # Homebrew, winget and AUR files; they point at the release, not into it.
  - "!packaging"
  - "!reports"
  - "!release"
  # The renderer benchmark's own build (`npm run benchmark:renderer`).
  - "!dist-benchmark"
  - "!scripts"
  - "!src"
  - "!*.md"
  - "!index.html"
  - "!index.web.html"
  - "!Makefile"
  - "!electron-builder.yml"
  - "!t3.json"
  - "!.oxlintrc.json"
  - "!tsconfig*.json"
  # The Vite configs and their plugins; the editable source (`dist-source`) carries them.
  - "!vite.*.ts"
  - "!vitest.config.ts"
  - "!**/*.test.js"
  - "!**/*.test.js.map"
  # esbuild's npm command line, a second 10 MB copy of the binary the library
  # itself never runs. Dependencies bring their own esbuild, built for the build machine.
  - "!**/node_modules/esbuild/bin{,/**}"
  # Pi ships its handbook and example extensions for the CLI; Tau reads neither,
  # and the examples alone carry a 4 MB WebAssembly demo.
  - "!node_modules/@earendil-works/pi-coding-agent/docs"
  - "!node_modules/@earendil-works/pi-coding-agent/examples"
  - "!node_modules/@earendil-works/pi-coding-agent/CHANGELOG.md"
  - "!node_modules/@earendil-works/pi-coding-agent/npm-shrinkwrap.json"
  # Computer use ships a driver binary per platform, ~30 MB each; `${platform}`
  # is the builder's own OS (darwin/linux/win32), which is always the target
  # since nothing here cross-compiles. This has to live in the one root `files`
  # list: a same-shaped `files` under `mac`/`linux`/`win` builds a *second*,
  # unmerged file-copy root alongside this one, and electron-builder then walks
  # the project twice concurrently into the same destination — the two copies
  # race on every file only one of them excludes, which is a hard-to-reproduce
  # `EEXIST` on whichever file loses the race, not necessarily this one.
  - "!node_modules/@amaster.ai/pi-computer-use/bin/!(${platform}*)/**"
  # Each app carries only native files for its own OS and architecture
  # (scripts/packaging/mac-architectures.mjs). Both Mac apps pack from one
  # node_modules holding both architectures' platform packages...
  - "!**/node_modules/@*/*darwin-!(${arch}|universal)"
  - "!**/node_modules/@*/*darwin-!(${arch}|universal)/**"
  # ...and packages ship prebuilds for every platform in the one package.
  - "!**/node_modules/**/prebuilds/!(${platform}-*${arch}*|${platform}-universal)"
  - "!**/node_modules/**/prebuilds/!(${platform}-*${arch}*|${platform}-universal)/**"

# Unpacks the Mac platform packages npm skipped for the architecture being packed.
beforeBuild: ./scripts/packaging/mac-architectures.mjs
# Fails a Mac build that still holds a native file for another architecture.
afterPack: ./scripts/packaging/mac-architectures.mjs

# Files a real path on disk must reach, so an archive entry will not do.
asarUnpack:
  # A managed source overlay links against the installed dependency tree while
  # it builds. Keeping packages on the real filesystem makes that link usable
  # by Node, TypeScript and Vite outside Electron's asar-aware process.
  - "node_modules/**"
  # `new Worker(file)` reads the entry before Electron's archive support is
  # installed in the worker, and the headless host is started as a plain script.
  # That host is the window's child process (ADR 0021): the shared modules it
  # imports and the kits it loads must be real files beside it.
  - "dist-electron/main/**"
  - "dist-electron/shared/**"
  - "dist-kits/**"
  # Pi resizes images in a worker thread that instantiates WebAssembly from disk.
  - "node_modules/@earendil-works/pi-coding-agent/dist/utils/image-resize-worker.js"
  - "node_modules/@earendil-works/pi-coding-agent/node_modules/@silvia-odwyer/photon-node/**"
  # Computer use launches a driver app of its own.
  - "node_modules/@amaster.ai/pi-computer-use/bin/**"
  # `tau app <path>`: a command line Node runs, so it must be a real file.
  - "bin/**"
  - "**/*.node"

# A clean installation carries the editable inputs for its version. Tau copies
# these into userData on first use; the signed application remains untouched.
extraResources:
  - from: "dist-source"
    to: "tau-source"
  # TypeScript needs Electron's declarations, but the overlay runs on the
  # installed Electron and must not carry a second Electron binary.
  - from: "node_modules/electron"
    to: "tau-source-vendor/electron"
    filter:
      - "package.json"
      - "electron.d.ts"
  # electron-builder prunes declaration files from dependencies. TypeScript's
  # standard library declarations are executable build inputs, so keep its
  # complete package beside the source seed.
  - from: "node_modules/typescript"
    to: "tau-source-vendor/typescript"

mac:
  # Architectures come from the command line (`--arm64 --x64`); without one the
  # build is for the host.
  target: [dmg, zip]
  icon: assets/tau-icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  # macOS 15+ asks before an app uses the local network; Bonjour announcing and
  # browsing count, and so does a connection to a LAN address (Apple TN3179).
  extendInfo:
    NSLocalNetworkUsageDescription: Tau uses the local network to let your devices connect to this Mac, to announce itself with Bonjour, and to find other machines running Tau.
    NSBonjourServices:
      - _tau._tcp
  # Signing and notarization stay off unless CSC_LINK/APPLE_ID are in the
  # environment; electron-builder turns both on by itself once they are.
  gatekeeperAssess: false

dmg:
  title: ${productName} ${version}

linux:
  # The .deb for Debian and Ubuntu, the AppImage for everything else.
  target: [AppImage, deb]
  icon: assets/tau-icon.png
  category: Development
  executableName: tau
  # package.json's description is the prototype's; packages and the menu entry show these.
  synopsis: Desktop workbench for the Pi coding agent
  description: Desktop workbench for the Pi coding agent
  # The .deb links /usr/bin/tau to it (packaging/linux/after-install.tpl).
  extraFiles:
    - from: packaging/linux/tau
      to: bin/tau

deb:
  packageName: tau
  artifactName: ${productName}_${version}_${arch}.${ext}
  maintainer: Torben Buck <7483565+Rasalas@users.noreply.github.com>
  packageCategory: devel
  # electron-builder's default list plus ALSA, which Electron links against and
  # an Ubuntu server does not have (libasound2t64 from 24.04 on).
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
  # Xvfb for `--display`, pkexec for the password dialog of an update and of
  # the AppArmor profile; the last one is electron-builder's default.
  recommends:
    - xvfb
    - pkexec | policykit-1
    - libappindicator3-1
  afterInstall: packaging/linux/after-install.tpl
  afterRemove: packaging/linux/after-remove.tpl

win:
  target: [nsis]
  icon: assets/tau-icon.png

nsis:
  # The GUID electron-builder derived from the former appId `dev.tbuck.tau`: it keys the
  # install's registry entries, so a new one would leave the old install listed beside it.
  guid: 7d8e2caa-afe3-56be-b6f2-d0ec52790759
  # Stamps the new AppUserModelID on shortcuts an update keeps (toasts need them to match).
  include: packaging/windows/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  # No spaces: GitHub renames "Tau Setup 1.2.3.exe" to "Tau.Setup.1.2.3.exe" on
  # upload, while latest.yml names it "Tau-Setup-1.2.3.exe", so Windows found no update.
  artifactName: ${productName}-Setup-${version}.${ext}

publish:
  provider: github
  owner: Rasalas
  repo: tau
