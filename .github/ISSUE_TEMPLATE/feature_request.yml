name: Feature request
description: Suggest something Tau should do.
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. Say whether it could be a kit or an extension package rather than a change to core.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
