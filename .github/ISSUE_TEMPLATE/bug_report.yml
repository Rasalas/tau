name: Bug report
description: Something in Tau does not work as it should.
labels: ["needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tau version
      description: Settings → About.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux, Windows, iOS, Android, Web client]
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Agent runtime and model
      description: For example Pi with a given model, or Codex. Leave empty if it does not matter.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, host names and paths you don't want to share.
