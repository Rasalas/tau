name: Performance gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  performance:
    # Self-hosted unless the PR comes from a fork (see ci.yml).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tau-linux' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 runners restrict unprivileged user namespaces, which Electron's
      # sandbox needs; the benchmarks launch real Electron windows under xvfb.
      - name: Allow Electron's sandbox on the runner
        if: runner.environment == 'github-hosted'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Lint, typecheck, tests
        run: npm run lint && npm run typecheck && npm test
      - name: Build, Git and host budgets
        run: npm run build:budget && npm run benchmark:git:check && npm run benchmark:host:check && npm run benchmark:host:full:check
      # Frame and mount timings from a shared runner are not release numbers; the
      # local gate is `npm run performance:ci` (docs/PERFORMANCE.md). Here they are
      # published for trend reading but do not fail the workflow.
      - name: Renderer and start budgets (advisory on shared runners)
        continue-on-error: true
        run: xvfb-run -a sh -c 'npm run benchmark:renderer -- --no-build --check && npm run start:report -- --check'
      - name: Publish performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 3
