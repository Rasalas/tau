name: Performance gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 runners restrict unprivileged user namespaces, which Electron's
      # sandbox needs; the benchmarks launch real Electron windows under xvfb.
      - name: Allow Electron's sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run type, test, build, renderer, and start budgets
        run: xvfb-run -a npm run performance:ci
      - name: Publish performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: reports/*.json
          if-no-files-found: warn
