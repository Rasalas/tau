name: Performance gates

on:
  pull_request:
  push:
    branches: [main]
  # A first run on a repository whose history arrived while Actions were off.
  workflow_dispatch:

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  timing-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Allow Electron's sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Resolve exact comparison base
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ]; then BASE_SHA=$(git rev-parse HEAD^); fi
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "An existing exact base SHA is required for timing comparison" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"
      # checkout authenticates this exact fetch without retaining credentials,
      # including in private repositories. The subsequent fetch is local.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: .performance-base
          fetch-depth: 1
          persist-credentials: false
      - name: Compare base and head on the same runner
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git fetch --no-tags --depth=1 ./.performance-base "$BASE_SHA"
          xvfb-run -a node scripts/run-performance-comparison.mjs --base "$BASE_SHA"
      - name: Publish paired measurements and frozen harness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timing-comparison
          path: |
            reports/comparison-*
            reports/timing-comparison*.json
          if-no-files-found: error
          retention-days: 7
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Electron's sandbox needs.
      - name: Allow Electron's sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The last main runs' build times; PRs read main's entry, only main pushes write one.
      - name: Restore build-time history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build-time-history
          key: build-time-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build-time-history-
      # Sizes and counts are deterministic; build time is held at reference speed and
      # against the history (docs/PERFORMANCE.md, "Build time on shared runners").
      - name: Build and Git budgets
        id: build
        env:
          TAU_BUILD_TIME_HISTORY: .build-time-history/history.json
        run: npm run build:budget && npm run benchmark:git:check
      # Also after a failed check, so a regression that landed moves the median.
      - name: Record build time
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build.outcome != 'skipped' }}
        run: node scripts/build-time.mjs record .build-time-history/history.json
      - name: Save build-time history
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build-time-history
          key: build-time-history-${{ github.run_id }}-${{ github.run_attempt }}
      # Structural checks plus timings; the tight ones are listed in docs/PERFORMANCE.md.
      - name: Host budgets
        run: npm run benchmark:host:check && npm run benchmark:host:full:check
      - name: Session storage and paging budgets
        run: npm run benchmark:sessions -- --check
      # Complete measurements and structural budgets block. Shared-runner timing
      # violations are still reported, without making an otherwise valid run fail.
      - name: Start structural budgets
        run: xvfb-run -a npm run start:report -- --check-structural
      - name: Renderer structural budgets
        run: xvfb-run -a npm run benchmark:renderer -- --no-build --check-structural reports/renderer-ci-report.json
      - name: Publish performance measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-reports
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 3
