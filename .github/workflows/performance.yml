name: Performance gates

on:
  pull_request:
  push:
    branches: [main]
  # A first run on a repository whose history arrived while Actions were off.
  workflow_dispatch:

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Electron's sandbox needs.
      - name: Allow Electron's sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Sizes and counts are deterministic; the build-time budget only catches a runaway build.
      - name: Build and Git budgets
        run: npm run build:budget && npm run benchmark:git:check
      # Structural checks plus timings; the tight ones are listed in README.md.
      - name: Host budgets
        run: npm run benchmark:host:check && npm run benchmark:host:full:check
      # Frame and start timings from shared hardware are trend data, not a gate.
      - name: Renderer budget (advisory on shared runners)
        continue-on-error: true
        run: xvfb-run -a npm run benchmark:renderer -- --no-build --check
      - name: Start budget (advisory on shared runners)
        continue-on-error: true
        run: xvfb-run -a npm run start:report -- --check
      - name: Publish performance measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-reports
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 3
