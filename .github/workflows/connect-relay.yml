name: Connect relay checks

on:
  push:
    branches: [main]
    paths: ['connect-relay/**', '.github/workflows/connect-relay.yml']
  pull_request:
    paths: ['connect-relay/**', '.github/workflows/connect-relay.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: connect-relay/package-lock.json
      - run: npm ci --prefix connect-relay --omit=dev --ignore-scripts
      - run: npm --prefix connect-relay test
      - run: bash -n connect-relay/deploy-cloud.sh
      # Build before an identity exists, so package scripts cannot see credentials.
      - run: docker build --tag tau-connect:check connect-relay

