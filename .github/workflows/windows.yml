name: Windows

# Manual only: gh workflow run windows.yml --ref <branch> [-f full-suite=true]
# What it proves and what it does not: docs/windows.md.
on:
  workflow_dispatch:
    inputs:
      full-suite:
        description: Also run the whole test suite (not yet expected to pass on Windows; see docs/windows.md)
        type: boolean
        default: false

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the tests that only run on Windows (cmd.exe, where.exe, PowerShell, taskkill).
      - name: Windows tests
        run: >-
          npx vitest run
          src/main/shell-environment.test.ts
          src/main/platform-process.test.ts
          src/main/external-editor.test.ts
          src/main/window-attention.test.ts
          src/main/process-lock.test.ts
          src/main/session-locks.test.ts
          kits/terminal/shell.test.ts
          kits/workspace/editors.test.ts
          kits/workspace/host-paths.test.ts
      - run: npm run build
      - name: Smoke — remote host
        run: npm run smoke:remote-host
      - name: Smoke — extension install
        run: npm run smoke:extension-install
      - name: Full test suite
        if: inputs.full-suite
        continue-on-error: true
        run: npx vitest run
