name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on the repo-level self-hosted runners (labels tau-linux / tau-macos).
# Pull requests from forks fall back to GitHub-hosted runners: untrusted code
# must not execute on the private host.
jobs:
  fast:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tau-linux' }}
    # The self-hosted Linux runner takes 7–15 minutes for the test suite alone.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  # End-to-end pairing and package-install paths — the seams with the thinnest
  # unit coverage. `smoke:attached` needs a real Pi TUI plus paid model auth,
  # so it stays out of CI and remains a local check.
  smoke:
    needs: fast
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tau-linux' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke — remote host
        run: npm run smoke:remote-host
      - name: Smoke — extension install
        run: npm run smoke:extension-install
      - name: Smoke — remote work
        run: npm run smoke:remote-work
      # Passes with a note where Xvfb is missing; the Linux runner has it (performance.yml).
      - name: Smoke — invisible display
        run: npm run smoke:display
