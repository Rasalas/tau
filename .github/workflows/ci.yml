name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job needs a secret or write access; fork PRs get the same token anyway.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # The suite split three ways; hosted minutes are free on a public repo, waiting is not.
  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # `smoke:attached` needs a real Pi TUI plus paid model auth; it stays local.
  smoke:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke — remote host
        run: npm run smoke:remote-host
      - name: Smoke — extension install
        run: npm run smoke:extension-install
      - name: Smoke — remote work
        run: npm run smoke:remote-work
      # Requiring electron downloads its binary first, where npm ci left it out.
      - name: Electron's sandbox helper as setuid root
        run: |
          helper="$(dirname "$(node -p 'require("electron")' | tail -1)")/chrome-sandbox"
          sudo chown root:root "$helper" && sudo chmod 4755 "$helper"
      # ubuntu-24.04 ships Xvfb.
      - name: Smoke — invisible display
        run: npm run smoke:display
