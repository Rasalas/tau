name: Release

on:
  push:
    tags: ["v*.*.*"]
  # The nightly: 03:17 UTC, published only when main moved since the last one,
  # and only once the repository variable NIGHTLY is `true` (docs/RELEASE.md).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release from a tag ref (otherwise just build and upload artifacts)
        type: boolean
        default: false
      nightly:
        description: Build main and publish it as the nightly prerelease now, even without new commits
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Write access only where a release is made (release, nightly).
permissions:
  contents: read

jobs:
  # Decides whether this run builds at all, whether it is a nightly, and which
  # environment holds its secrets. Every other job needs it.
  gate:
    # A fork runs schedules too; only upstream publishes nightlies, once switched on.
    if: github.event_name != 'schedule' || (github.repository == 'Rasalas/tau' && vars.NIGHTLY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads CI's runs on this commit (verified below).
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      nightly: ${{ steps.decide.outputs.nightly }}
      version: ${{ steps.decide.outputs.version }}
      # true when ci.yml and performance.yml passed on exactly this commit; verify is then skipped.
      verified: ${{ steps.verified.outputs.verified }}
      # `release` holds the secrets and admits only main and v* tags; a branch's dry run gets
      # `release-dry-run`, which holds none, and builds unsigned.
      environment: ${{ steps.decide.outputs.environment }}
    steps:
      # Credentials kept: `git ls-remote origin` below. Trusted events only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          NIGHTLY: ${{ inputs.nightly }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" != schedule ] && [ "$NIGHTLY" != true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "nightly=false" >> "$GITHUB_OUTPUT"
            case "$REF" in
              refs/tags/v*|refs/heads/main) environment=release ;;
              *) if [ "$PUBLISH" = true ]; then environment=release; else environment=release-dry-run; fi ;;
            esac
            echo "environment=$environment" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PUBLISH" = true ]; then
            echo "::error::publish and nightly exclude each other."
            exit 1
          fi
          if [ "$REF" != refs/heads/main ] || [ "$REPOSITORY" != Rasalas/tau ]; then
            echo "::error::A nightly builds main of Rasalas/tau, not $REF of $REPOSITORY."
            exit 1
          fi
          echo "environment=release" >> "$GITHUB_OUTPUT"
          head="$(git rev-parse HEAD)"
          # The peeled line (^{}) names the commit when the tag is annotated.
          last="$(git ls-remote origin refs/tags/nightly 'refs/tags/nightly^{}' | tail -n 1 | cut -f 1)"
          if [ "$EVENT" = schedule ] && [ "$last" = "$head" ]; then
            echo "main is still at the last nightly ($head); nothing to publish."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "nightly=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(node scripts/packaging/nightly-version.mjs --run "$RUN_NUMBER")"
          echo "Nightly $version from $head (last nightly: ${last:-none})."
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "nightly=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: verified
        if: steps.decide.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: node scripts/packaging/verified-commit.mjs "$SHA" >> "$GITHUB_OUTPUT" || echo "verified=false" >> "$GITHUB_OUTPUT"

  # Fails a publishing run in seconds, before any runner builds, when a secret it needs is missing.
  preflight:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ needs.gate.outputs.environment }}
    timeout-minutes: 5
    steps:
      - name: Require a tag ref for publishing
        if: inputs.publish && github.ref_type != 'tag'
        run: |
          echo "::error::Publishing requires a tag ref. Dispatch this workflow on a tag, or set publish=false."
          exit 1
      # Installed hosts refuse an unsigned feed; fail before the builds. The sign job checks again.
      - name: Require the release signing key for publishing
        if: needs.gate.outputs.nightly == 'true' || startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          HAS_KEY: ${{ secrets.TAU_RELEASE_SIGNING_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::The secret TAU_RELEASE_SIGNING_KEY is not set; a release without signed update feeds would be refused by every installed Tau."
            exit 1
          fi
      # Installed apps read releases from the public Rasalas/tau-releases; the
      # GitHub App "Tau Releases (Rasalas)" is what may write there.
      - name: Require the app that publishes to tau-releases
        if: needs.gate.outputs.nightly == 'true' || startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          HAS_APP: ${{ secrets.TAU_RELEASES_APP_ID != '' && secrets.TAU_RELEASES_APP_KEY != '' }}
        run: |
          if [ "$HAS_APP" != true ]; then
            echo "::error::The secrets TAU_RELEASES_APP_ID and TAU_RELEASES_APP_KEY are not both set; installed Tau reads releases from Rasalas/tau-releases only."
            exit 1
          fi
      # Every stable release carries a signed APK, and TestFlight takes only a signed build.
      - name: Require the phone apps' signing keys for a stable release
        if: needs.gate.outputs.nightly != 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        env:
          HAS_ANDROID: ${{ secrets.ANDROID_UPLOAD_KEYSTORE != '' && secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' && secrets.ANDROID_UPLOAD_KEY_ALIAS != '' && secrets.ANDROID_GOOGLE_SERVICES_JSON != '' }}
          HAS_APPLE: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
        run: |
          if [ "$HAS_ANDROID" != true ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE, ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS and ANDROID_GOOGLE_SERVICES_JSON are not all set; a release needs a signed APK that can take pushes."
            exit 1
          fi
          if [ "$HAS_APPLE" != true ]; then
            echo "::error::APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER are not all set; the iOS build cannot be signed or uploaded."
            exit 1
          fi

  # The checks ci.yml runs, for a commit CI has not passed yet. They run beside the builds; nothing
  # is signed or published before they pass (sign, ios).
  verify:
    needs: gate
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run

  build:
    needs: [gate, preflight]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Only the macOS builds sign, so only they enter the environment with Apple's credentials.
    environment: ${{ matrix.mac && needs.gate.outputs.environment || '' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner per Mac architecture, so the two notarizations wait side by side; the sign job
          # merges their latest-mac.yml files (scripts/packaging/merge-feeds.mjs).
          # macos-26 is arm64 and ships Xcode 26 (actool for assets/icon/Tau.icon).
          - name: macOS arm64
            runner: macos-26
            platform: --mac --arm64
            artifact: macos-arm64
            mac: true
          - name: macOS x64
            runner: macos-26
            platform: --mac --x64
            artifact: macos-x64
            mac: true
          - name: Linux x64
            runner: ubuntu-24.04
            platform: --linux --x64
            artifact: linux
          # SSH hosts include ARM Linux machines. Only their portable archive is
          # published here, so this does not replace the desktop Linux update feed.
          - name: Linux arm64 portable host
            runner: ubuntu-24.04-arm
            platform: --linux --arm64 --dir
            artifact: linux-arm64
          - name: Windows x64
            runner: windows-2025
            # node-pty's N-API binaries load as they are; a node-gyp rebuild fails on the runner.
            platform: --win --x64 -c.npmRebuild=false
            artifact: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Pinned so an image update cannot move the Icon Composer compiler under a release.
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun actool --version
      # Electron and electron-builder download these on first use; npm's cache does not hold them.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      # Before the build, so the app, its update feed and the file names all carry it.
      - name: Stamp the nightly version
        if: needs.gate.outputs.nightly == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: npm pkg set version="$VERSION"
      - run: npm run build

      - name: Package
        shell: bash
        env:
          # Empty outside the macOS builds: Windows would try the Developer ID certificate for Authenticode.
          # CSC_LINK is the base64 of the .p12; electron-builder imports it into a temporary keychain.
          CSC_LINK: ${{ matrix.mac && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.mac && secrets.CSC_KEY_PASSWORD || '' }}
          # Notarization through the App Store Connect API key; the .p8 is written to a file below.
          APPLE_API_KEY_P8: ${{ matrix.mac && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.mac && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.mac && secrets.APPLE_API_ISSUER || '' }}
          # Writes release/builder-debug.yml, from which a failing platform is diagnosed.
          DEBUG: electron-builder
        run: |
          # electron-builder treats an empty value as "set", so an unsigned build unsets them.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name-}" ] || unset "$name"
          done
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            key="$RUNNER_TEMP/notary-api-key.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            chmod 600 "$key"
            export APPLE_API_KEY="$key"
            unset APPLE_API_KEY_P8
          fi
          [ -n "${CSC_LINK:-}" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          status=0
          npx electron-builder -c tooling/electron-builder.yml ${{ matrix.platform }} --publish never || status=$?
          rm -f "$RUNNER_TEMP/notary-api-key.p8"
          exit "$status"

      - name: Package the portable remote host
        shell: bash
        run: node scripts/packaging/portable-host.mjs ${{ (matrix.artifact == 'macos-arm64' || matrix.artifact == 'linux-arm64') && 'arm64' || 'x64' }}

      # What apt installs and what DebUpdater downloads: Xvfb comes along, the
      # AppArmor profile is inside, and the feed names the package.
      - name: Check the .deb
        if: matrix.artifact == 'linux'
        shell: bash
        run: |
          deb="$(ls release/Tau_*_amd64.deb)"
          dpkg-deb --field "$deb" Package Version Depends Recommends
          # Listed first: grep -q closing the pipe would fail dpkg-deb under pipefail.
          files="$(dpkg-deb -c "$deb")"
          grep -q '\bxvfb\b' <<< "$(dpkg-deb --field "$deb" Recommends)"
          grep -q ' \./opt/Tau/resources/apparmor-profile$' <<< "$files"
          grep -q ' \./opt/Tau/bin/tau$' <<< "$files"
          # The update helper, its script and the polkit files postinst puts in place (docs/host-updates.md).
          paths="$(awk '{ print $NF }' <<< "$files")"
          for path in \
            ./opt/Tau/bin/tau-update-helper \
            ./opt/Tau/resources/app.asar.unpacked/bin/tau-update-helper.mjs \
            ./opt/Tau/resources/polkit/de.tbuck.tau.update.policy \
            ./opt/Tau/resources/polkit/50-tau-update.rules \
            ./opt/Tau/resources/polkit/50-tau-update.pkla; do
            grep -qxF "$path" <<< "$paths" || { echo "::error::The .deb lacks $path."; exit 1; }
          done
          grep -qF /usr/share/polkit-1/actions/de.tbuck.tau.update.policy <<< "$(dpkg-deb --info "$deb" postinst)"
          grep -q "url: $(basename "$deb")" release/latest-linux.yml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tau-${{ matrix.artifact }}
          if-no-files-found: error
          # Consumed by the release job in this run; published files live in the GitHub releases.
          retention-days: 1
          # The feeds travel apart: the sign job merges and signs them into tau-feeds.
          path: |
            release/*.dmg
            release/*.zip
            release/*.tar.gz
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.blockmap

      # The update feed alone, for the sign job; the installers stay in tau-<platform>.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feed-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1
          path: release/latest*.yml

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp release/builder-debug.yml diagnostics/ 2>/dev/null || true
          npm_cache="$(npm config get cache)"
          find "$npm_cache/_logs" -type f -name '*.log' -exec cp {} diagnostics/ \; 2>/dev/null || true

      # Readable by anyone on a public repository; named so the release jobs' tau-* pattern skips it.
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-${{ matrix.artifact }}
          if-no-files-found: ignore
          path: diagnostics
          retention-days: 7

  # The Android app for a stable release: a signed App Bundle for Play (the play job) and an APK the
  # release carries for sideloading. versionCode comes from the version (build.gradle).
  android:
    needs: [gate, preflight]
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.nightly != 'true'
    runs-on: ubuntu-24.04
    environment: ${{ needs.gate.outputs.environment }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      # The web layer builds from the repository's sources; Electron itself is not needed.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm ci
        working-directory: mobile
      - name: Build the web layer
        working-directory: mobile
        run: |
          npx vite build
          npx cap sync android
          if grep -l tauAutomation dist/assets/*.js; then echo "::error::The release web layer contains the automation bridge."; exit 1; fi
      - name: Write the Firebase project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON is not set; this Android build cannot take pushes."
            exit 0
          fi
          file=mobile/android/app/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > "$file"
          # Google's Gradle plugin fails on a project without this package, with an error that does not say so.
          if ! node -e 'const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); process.exit((d.client ?? []).some((c) => c.client_info?.android_client_info?.package_name === "de.tbuck.tau") ? 0 : 1)' "$file"; then
            rm -f "$file"
            if [ "$PUBLISHING" = true ]; then
              echo "::error::The Firebase project in ANDROID_GOOGLE_SERVICES_JSON has no Android app de.tbuck.tau; a release would ship without pushes."
              exit 1
            fi
            echo "::warning::The Firebase project in ANDROID_GOOGLE_SERVICES_JSON has no Android app de.tbuck.tau; this dry run cannot take pushes."
          fi
      - name: Build the App Bundle and the APK
        working-directory: mobile/android
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          TAU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          TAU_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          if [ -n "${UPLOAD_KEYSTORE:-}" ]; then
            export TAU_ANDROID_KEYSTORE="$RUNNER_TEMP/upload.p12"
            printf '%s' "$UPLOAD_KEYSTORE" | base64 -d > "$TAU_ANDROID_KEYSTORE"
            chmod 600 "$TAU_ANDROID_KEYSTORE"
          else
            echo "::warning::ANDROID_UPLOAD_KEYSTORE is not set; this dry run builds an unsigned App Bundle and APK."
          fi
          unset UPLOAD_KEYSTORE
          status=0
          ./gradlew --no-daemon bundleRelease assembleRelease || status=$?
          rm -f "$RUNNER_TEMP/upload.p12"
          exit "$status"
      - name: Name and check the files
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          out=mobile/android/app/build/outputs
          mkdir -p android play
          if [ -f "$out/apk/release/app-release.apk" ]; then
            apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
            "$apksigner" verify "$out/apk/release/app-release.apk"
            cp "$out/apk/release/app-release.apk" "android/Tau-$version.apk"
          else
            cp "$out/apk/release/app-release-unsigned.apk" "android/Tau-$version-unsigned.apk"
          fi
          cp "$out/bundle/release/app-release.aab" "play/Tau-$version.aab"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2"
          # Whole, then its first line: head closing the pipe would fail aapt2 under pipefail.
          badging="$("$aapt2" dump badging android/Tau-"$version"*.apk)"
          badging="${badging%%$'\n'*}"
          echo "$badging"
          grep -q "name='de.tbuck.tau' versionCode='$(node scripts/packaging/mobile-version.mjs android-code)' versionName='$version'" <<< "$badging"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tau-android
          if-no-files-found: error
          retention-days: 1
          path: android/*.apk
      # Not in tau-*: the bundle goes to Play, not into the release.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: play-bundle
          if-no-files-found: error
          retention-days: 1
          path: play/*.aab

  # The iPhone and iPad app to TestFlight, signed automatically with the App Store Connect key. It
  # waits for verify (when that runs) and is not part of the release: TestFlight gets the build
  # whatever becomes of the desktop release. A dry run archives without uploading.
  ios:
    needs: [gate, preflight, verify]
    if: ${{ !cancelled() && needs.gate.outputs.build == 'true' && needs.gate.outputs.nightly != 'true' && needs.preflight.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: macos-26
    environment: ${{ needs.gate.outputs.environment }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm ci
        working-directory: mobile
      - name: Build the web layer
        working-directory: mobile
        run: |
          npx vite build
          npx cap sync ios
          if grep -l tauAutomation dist/assets/*.js; then echo "::error::The release web layer contains the automation bridge."; exit 1; fi
      # The runner has no signing certificate; Apple's cloud signing would need an Admin key.
      - name: Import the distribution certificate
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          if [ -z "${IOS_DIST_P12:-}" ]; then
            echo "::warning::No IOS_DIST_P12; signing falls back to Apple's cloud signing."
            exit 0
          fi
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution" || { echo "::error::The imported certificate is not an Apple Distribution identity."; exit 1; }
          echo "IOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Install profiles for the app and widget
        env:
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          IOS_WIDGET_PROFILE: ${{ secrets.IOS_WIDGET_PROFILE }}
        run: python3 scripts/packaging/ios-profiles.py "$RUNNER_TEMP/tau-profiles"
      - name: Archive, and upload to TestFlight
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          RUN_NUMBER: ${{ github.run_number }}
          UPLOAD: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          build="$(node scripts/packaging/mobile-version.mjs ios-build --run "$RUN_NUMBER")"
          echo "Tau for iOS $version ($build)"
          archive="$RUNNER_TEMP/Tau.xcarchive"
          settings=(MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build")
          project=(-project mobile/ios/App/App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS -archivePath "$archive")
          if [ -z "${APPLE_API_KEY_P8:-}" ]; then
            echo "::warning::No App Store Connect key; this dry run archives unsigned and uploads nothing."
            xcodebuild archive "${project[@]}" "${settings[@]}" CODE_SIGNING_ALLOWED=NO
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          unset APPLE_API_KEY_P8
          trap 'rm -f "$key"' EXIT
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER")
          signing=(CODE_SIGN_STYLE=Automatic)
          if [ -f "$RUNNER_TEMP/tau-profiles/profiles.xcconfig" ]; then
            signing=(-xcconfig "$RUNNER_TEMP/tau-profiles/profiles.xcconfig")
          fi
          xcodebuild archive "${project[@]}" "${settings[@]}" DEVELOPMENT_TEAM=V4MWQ28RZ2 "${signing[@]}" "${auth[@]}"
          if [ "$UPLOAD" != true ]; then
            echo "A dry run: archived $version ($build), not uploaded."
            exit 0
          fi
          cat > "$RUNNER_TEMP/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>V4MWQ28RZ2</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          if [ -f "$RUNNER_TEMP/tau-profiles/profiles.json" ]; then
            plutil -replace signingStyle -string manual "$RUNNER_TEMP/export.plist"
            plutil -replace signingCertificate -string 'Apple Distribution' "$RUNNER_TEMP/export.plist"
            plutil -replace provisioningProfiles -json "$(cat "$RUNNER_TEMP/tau-profiles/profiles.json")" "$RUNNER_TEMP/export.plist"
          fi
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          echo "::notice::Uploaded Tau for iOS $version ($build) to TestFlight."
      - name: Remove the signing keychain
        if: ${{ always() && env.IOS_SIGNING_KEYCHAIN != '' }}
        run: security delete-keychain "$IOS_SIGNING_KEYCHAIN"

  # Merges the Mac feeds of the two architectures, then signs every latest*.yml with
  # TAU_RELEASE_SIGNING_KEY; installed hosts refuse a feed without the .sig (docs/host-updates.md).
  # A branch's dry run has no key and stays unsigned. Waits for verify when that runs.
  sign:
    needs: [gate, build, verify]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: ${{ needs.gate.outputs.environment }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # One folder per build: both Mac builds wrote a latest-mac.yml.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: feed-*
          path: feeds-by-build
      - name: Merge the Mac feeds
        run: node scripts/packaging/merge-feeds.mjs feeds-by-build feed
      - id: sign
        name: Sign the update feeds
        shell: bash
        env:
          TAU_RELEASE_SIGNING_KEY: ${{ secrets.TAU_RELEASE_SIGNING_KEY }}
          PUBLISHING: ${{ needs.gate.outputs.nightly == 'true' || startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
        run: |
          # One per platform of the matrix; a missing one leaves that platform without updates.
          for name in latest-mac.yml latest.yml latest-linux.yml latest-host-darwin-arm64.yml latest-host-darwin-x64.yml latest-host-linux-x64.yml latest-host-linux-arm64.yml latest-host-win32-x64.yml; do
            [ -f "feed/$name" ] || { echo "::error::The builds wrote no $name."; exit 1; }
          done
          if [ -z "${TAU_RELEASE_SIGNING_KEY:-}" ]; then
            if [ "$PUBLISHING" = true ]; then
              echo "::error::The secret TAU_RELEASE_SIGNING_KEY is not set; refusing to publish unsigned update feeds."
              exit 1
            fi
            echo "::warning::The secret TAU_RELEASE_SIGNING_KEY is not set; this dry run is not signed."
            exit 0
          fi
          node scripts/packaging/release-signing.mjs sign feed/latest*.yml
          # Fails when the secret is not a key this commit's hosts trust.
          node scripts/packaging/release-signing.mjs check feed/latest*.yml
      # The feeds a release publishes, with their .sig files once signed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tau-feeds
          if-no-files-found: error
          retention-days: 1
          path: feed/latest*

  # The release goes to two places: Rasalas/tau (tag, generated notes, every
  # file), and the public Rasalas/tau-releases, where installed apps and
  # install:mac read. Only tau-releases gets the fixed download names.
  release:
    needs: [gate, sign, android]
    if: ${{ !cancelled() && needs.sign.result == 'success' && needs.android.result == 'success' && needs.gate.outputs.nightly != 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # tau-<platform>, tau-android and tau-feeds (the merged, signed feeds).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tau-*
          path: artifacts
          merge-multiple: true
      - name: Add the license
        run: cp LICENSE artifacts/LICENSE
      - name: List what will be published
        run: ls -lh artifacts
      - name: Require the release key's signature on every update feed
        run: node scripts/packaging/release-signing.mjs check artifacts/latest*.yml
      # The latest*.yml files are what electron-updater reads; a release without
      # them installs fine and then never updates.
      - name: Require every file the feeds name, their blockmaps and the license
        run: node scripts/packaging/publish-release.mjs check artifacts
      - id: source
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
      # GitHub writes the notes from this repository's history; tau-releases has none.
      - name: Take the notes along
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          RELEASE_ID: ${{ steps.source.outputs.id }}
        with:
          script: |
            const { releaseBody } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/packaging/publish-release.mjs`);
            const body = await releaseBody(github, { ...context.repo, releaseId: Number(process.env.RELEASE_ID) });
            require("node:fs").writeFileSync("release-notes.md", body);
      # Tau-mac-arm64.dmg and the others, for releases/latest/download/<name> links.
      - name: Add the fixed download names
        run: |
          node scripts/packaging/publish-release.mjs copy-stable artifacts
          node scripts/packaging/publish-release.mjs check artifacts --stable
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TAU_RELEASES_APP_ID }}
          private-key: ${{ secrets.TAU_RELEASES_APP_KEY }}
          owner: Rasalas
          repositories: tau-releases
          permission-contents: write
      # A draft first: installed apps keep seeing the previous release until
      # every file is up. Its tag lands on tau-releases' default branch.
      - id: public
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: Rasalas/tau-releases
          token: ${{ steps.token.outputs.token }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
      - name: Publish the public release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          RELEASE_ID: ${{ steps.public.outputs.id }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { PUBLIC_REPO, publishDraft, releaseFiles } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/packaging/publish-release.mjs`);
            const url = await publishDraft(github, { ...PUBLIC_REPO, releaseId: Number(process.env.RELEASE_ID), names: releaseFiles("artifacts"), latest: true });
            core.notice(`Published ${url}`);

  # One prerelease under the moving tag `nightly`, in both repositories: the
  # previous one and its tag go first, so no stale asset stays behind. The gate
  # reads Rasalas/tau's tag; an installed Tau on the nightly channel reads
  # tau-releases' latest*.yml.
  nightly:
    needs: [gate, sign]
    if: ${{ !cancelled() && needs.sign.result == 'success' && needs.gate.outputs.nightly == 'true' }}
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tau-*
          path: artifacts
          merge-multiple: true
      - name: Add the license
        run: cp LICENSE artifacts/LICENSE
      - name: List what will be published
        run: ls -lh artifacts
      - name: Require the release key's signature on every update feed
        run: node scripts/packaging/release-signing.mjs check artifacts/latest*.yml
      - name: Require every file the feeds name, their blockmaps and the license
        run: node scripts/packaging/publish-release.mjs check artifacts
      - name: Remove the previous nightly
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { removeNightly } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/packaging/publish-release.mjs`);
            await removeNightly(github, context.repo);
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly ${{ needs.gate.outputs.version }}
          body: |
            Built from ${{ github.sha }} on main. Nightly builds are untested; Settings → Defaults → Update track switches an installed Tau between Stable and Nightly.
          prerelease: true
          make_latest: false
          files: artifacts/*
          fail_on_unmatched_files: true
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TAU_RELEASES_APP_ID }}
          private-key: ${{ secrets.TAU_RELEASES_APP_KEY }}
          owner: Rasalas
          repositories: tau-releases
          permission-contents: write
      - name: Remove the previous public nightly
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { PUBLIC_REPO, removeNightly } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/packaging/publish-release.mjs`);
            await removeNightly(github, PUBLIC_REPO);
      # No target_commitish: the source commit does not exist in tau-releases,
      # so the tag lands on its default branch and the body names the commit.
      - id: public
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: Rasalas/tau-releases
          token: ${{ steps.token.outputs.token }}
          tag_name: nightly
          name: Nightly ${{ needs.gate.outputs.version }}
          body: |
            Built from ${{ github.sha }} on main. Nightly builds are untested; Settings → Defaults → Update track switches an installed Tau between Stable and Nightly.
          prerelease: true
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
      - name: Publish the public nightly
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          RELEASE_ID: ${{ steps.public.outputs.id }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { PUBLIC_REPO, publishDraft, releaseFiles } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/packaging/publish-release.mjs`);
            const url = await publishDraft(github, { ...PUBLIC_REPO, releaseId: Number(process.env.RELEASE_ID), names: releaseFiles("artifacts"), latest: false });
            core.notice(`Published ${url}`);

  # The App Bundle of a published release to Play's internal testing track, once the
  # secret PLAY_SERVICE_ACCOUNT_JSON exists (docs/RELEASE.md, "Phone apps").
  play:
    needs: [gate, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: play-bundle
          path: play
      - name: Upload to Google Play (internal testing)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set; the App Bundle was not uploaded to Play. It stays in the run's play-bundle artifact for a day."
            exit 0
          fi
          version="$(node -p 'require("./package.json").version')"
          node scripts/packaging/play-upload.mjs "play/Tau-$version.aab" --version "$version" --track internal
