name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release from the build (otherwise just build and upload artifacts)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS architectures build on one runner so the two of them
          # write a single latest-mac.yml; two jobs would overwrite each other's
          # and leave one architecture without updates.
          - name: macOS (arm64 and x64)
            runner: macos-14
            platform: --mac --arm64 --x64
            artifact: macos
          - name: Linux x64
            runner: ubuntu-latest
            platform: --linux --x64
            artifact: linux
          - name: Windows x64
            runner: windows-latest
            platform: --win --x64
            artifact: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Package
        shell: bash
        env:
          # Signing turns itself on once these are set. electron-builder treats
          # an empty value as "set", so an unsigned build has to unset them.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Makes electron-builder write release/builder-debug.yml, which is
          # otherwise silent; a failing platform is diagnosed from it.
          DEBUG: electron-builder
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name-}" ] || unset "$name"
          done
          [ -n "${CSC_LINK:-}" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder ${{ matrix.platform }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: tau-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.exe
            release/*.blockmap
            release/latest*.yml

      # electron-builder's debug log and npm's own log live outside `release/`
      # and are only worth keeping when something went wrong.
      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp release/builder-debug.yml diagnostics/ 2>/dev/null || true
          npm_cache="$(npm config get cache)"
          find "$npm_cache/_logs" -type f -name '*.log' -exec cp {} diagnostics/ \; 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tau-${{ matrix.artifact }}-diagnostics
          if-no-files-found: ignore
          path: diagnostics

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List what will be published
        run: ls -lh artifacts
      # The latest*.yml files are what electron-updater reads; a release without
      # them installs fine and then never updates.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
