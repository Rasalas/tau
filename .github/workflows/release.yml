name: Release

on:
  push:
    tags: ["v*.*.*"]
  # The nightly: 03:17 UTC, published only when main moved since the last one,
  # and only once the repository variable NIGHTLY is `true` (docs/RELEASE.md).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release from a tag ref (otherwise just build and upload artifacts)
        type: boolean
        default: false
      nightly:
        description: Build main and publish it as the nightly prerelease now, even without new commits
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Decides whether this run builds at all, and whether it is a nightly. Every
  # other job needs it, so a nightly with nothing new stops here.
  gate:
    # A fork runs schedules too; only the upstream repository publishes nightlies,
    # and only after someone switched them on.
    if: github.event_name != 'schedule' || (github.repository == 'Rasalas/tau' && vars.NIGHTLY == 'true')
    runs-on: tau-linux
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      nightly: ${{ steps.decide.outputs.nightly }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          NIGHTLY: ${{ inputs.nightly }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" != schedule ] && [ "$NIGHTLY" != true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "nightly=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PUBLISH" = true ]; then
            echo "::error::publish and nightly exclude each other."
            exit 1
          fi
          if [ "$REF" != refs/heads/main ] || [ "$REPOSITORY" != Rasalas/tau ]; then
            echo "::error::A nightly builds main of Rasalas/tau, not $REF of $REPOSITORY."
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          # The peeled line (^{}) names the commit when the tag is annotated.
          last="$(git ls-remote origin refs/tags/nightly 'refs/tags/nightly^{}' | tail -n 1 | cut -f 1)"
          if [ "$EVENT" = schedule ] && [ "$last" = "$head" ]; then
            echo "main is still at the last nightly ($head); nothing to publish."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "nightly=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(node scripts/packaging/nightly-version.mjs --run "$RUN_NUMBER")"
          echo "Nightly $version from $head (last nightly: ${last:-none})."
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "nightly=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Same gates as ci.yml, so a tag that points at a red commit stops here
  # instead of shipping a broken build. Cheap enough to run on every release.
  verify:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: tau-linux
    # The same suite as CI's fast job, with its limit: it takes about 20 minutes on the runner.
    timeout-minutes: 30
    steps:
      - name: Require a tag ref for publishing
        if: inputs.publish && github.ref_type != 'tag'
        run: |
          echo "::error::Publishing requires a tag ref. Dispatch this workflow on a tag, or set publish=false."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run

  build:
    needs: [gate, verify]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS architectures build on one runner so the two of them
          # write a single latest-mac.yml; two jobs would overwrite each other's
          # and leave one architecture without updates.
          - name: macOS (arm64 and x64)
            # Self-hosted Mac mini; avoids the 10x macOS minute rate.
            runner: tau-macos
            platform: --mac --arm64 --x64
            artifact: macos
          - name: Linux x64
            runner: ubuntu-latest
            platform: --linux --x64
            artifact: linux
          - name: Windows x64
            runner: windows-latest
            platform: --win --x64
            artifact: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Before the build, so the app, its update feed and the file names all carry it.
      - name: Stamp the nightly version
        if: needs.gate.outputs.nightly == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: npm pkg set version="$VERSION"
      - run: npm run build

      - name: Package
        shell: bash
        env:
          # Signing turns itself on once these are set. electron-builder treats
          # an empty value as "set", so an unsigned build has to unset them.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Makes electron-builder write release/builder-debug.yml, which is
          # otherwise silent; a failing platform is diagnosed from it.
          DEBUG: electron-builder
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name-}" ] || unset "$name"
          done
          [ -n "${CSC_LINK:-}" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder ${{ matrix.platform }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: tau-${{ matrix.artifact }}
          if-no-files-found: error
          # Consumed by the release job in this run; published files live in
          # the GitHub release. Long retention filled the account's storage.
          retention-days: 1
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.exe
            release/*.blockmap
            release/latest*.yml

      # electron-builder's debug log and npm's own log live outside `release/`
      # and are only worth keeping when something went wrong.
      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp release/builder-debug.yml diagnostics/ 2>/dev/null || true
          npm_cache="$(npm config get cache)"
          find "$npm_cache/_logs" -type f -name '*.log' -exec cp {} diagnostics/ \; 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tau-${{ matrix.artifact }}-diagnostics
          if-no-files-found: ignore
          path: diagnostics
          retention-days: 7

  release:
    needs: [gate, build]
    if: needs.gate.outputs.nightly != 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
    runs-on: tau-linux
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List what will be published
        run: ls -lh artifacts
      # The latest*.yml files are what electron-updater reads; a release without
      # them installs fine and then never updates.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # One prerelease under the moving tag `nightly`: the previous one and its tag
  # go first, so the tag points at this commit and no stale asset stays behind.
  # An installed Tau on the nightly channel reads its latest*.yml from there.
  nightly:
    needs: [gate, build]
    if: needs.gate.outputs.nightly == 'true'
    runs-on: tau-linux
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List what will be published
        run: ls -lh artifacts
      - name: Remove the previous nightly
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: "nightly" });
              if (!data.prerelease) throw new Error("The release tagged nightly is not a prerelease; refusing to delete it.");
              await github.rest.repos.deleteRelease({ owner, repo, release_id: data.id });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: "tags/nightly" });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly ${{ needs.gate.outputs.version }}
          body: |
            Built from ${{ github.sha }} on main. Nightly builds are untested; Settings → Defaults → Update track switches an installed Tau between Stable and Nightly.
          prerelease: true
          make_latest: false
          files: artifacts/*
          fail_on_unmatched_files: true
