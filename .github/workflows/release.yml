name: Release

on:
  push:
    tags: ["v*.*.*"]
  # The nightly: 03:17 UTC, published only when main moved since the last one,
  # and only once the repository variable NIGHTLY is `true` (docs/RELEASE.md).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release from a tag ref (otherwise just build and upload artifacts)
        type: boolean
        default: false
      nightly:
        description: Build main and publish it as the nightly prerelease now, even without new commits
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Decides whether this run builds at all, and whether it is a nightly. Every
  # other job needs it, so a nightly with nothing new stops here.
  gate:
    # A fork runs schedules too; only the upstream repository publishes nightlies,
    # and only after someone switched them on.
    if: github.event_name != 'schedule' || (github.repository == 'Rasalas/tau' && vars.NIGHTLY == 'true')
    runs-on: tau-linux
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      nightly: ${{ steps.decide.outputs.nightly }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          NIGHTLY: ${{ inputs.nightly }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" != schedule ] && [ "$NIGHTLY" != true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "nightly=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PUBLISH" = true ]; then
            echo "::error::publish and nightly exclude each other."
            exit 1
          fi
          if [ "$REF" != refs/heads/main ] || [ "$REPOSITORY" != Rasalas/tau ]; then
            echo "::error::A nightly builds main of Rasalas/tau, not $REF of $REPOSITORY."
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          # The peeled line (^{}) names the commit when the tag is annotated.
          last="$(git ls-remote origin refs/tags/nightly 'refs/tags/nightly^{}' | tail -n 1 | cut -f 1)"
          if [ "$EVENT" = schedule ] && [ "$last" = "$head" ]; then
            echo "main is still at the last nightly ($head); nothing to publish."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "nightly=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(node scripts/packaging/nightly-version.mjs --run "$RUN_NUMBER")"
          echo "Nightly $version from $head (last nightly: ${last:-none})."
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "nightly=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Same gates as ci.yml, so a tag that points at a red commit stops here
  # instead of shipping a broken build. Cheap enough to run on every release.
  verify:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: tau-linux
    # The same suite as CI's fast job, with its limit: it takes about 20 minutes on the runner.
    timeout-minutes: 30
    steps:
      - name: Require a tag ref for publishing
        if: inputs.publish && github.ref_type != 'tag'
        run: |
          echo "::error::Publishing requires a tag ref. Dispatch this workflow on a tag, or set publish=false."
          exit 1
      # Installed hosts refuse an unsigned feed, so a run that publishes stops
      # here rather than after the builds. The sign job checks again.
      - name: Require the release signing key for publishing
        if: needs.gate.outputs.nightly == 'true' || startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          HAS_KEY: ${{ secrets.TAU_RELEASE_SIGNING_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::The secret TAU_RELEASE_SIGNING_KEY is not set; a release without signed update feeds would be refused by every installed Tau."
            exit 1
          fi
      # Installed apps read releases from the public Rasalas/tau-releases; the
      # GitHub App "Tau Releases (Rasalas)" is what may write there.
      - name: Require the app that publishes to tau-releases
        if: needs.gate.outputs.nightly == 'true' || startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          HAS_APP: ${{ secrets.TAU_RELEASES_APP_ID != '' && secrets.TAU_RELEASES_APP_KEY != '' }}
        run: |
          if [ "$HAS_APP" != true ]; then
            echo "::error::The secrets TAU_RELEASES_APP_ID and TAU_RELEASES_APP_KEY are not both set; installed Tau reads releases from Rasalas/tau-releases only."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run

  build:
    needs: [gate, verify]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS architectures build on one runner so the two of them
          # write a single latest-mac.yml; two jobs would overwrite each other's
          # and leave one architecture without updates.
          - name: macOS (arm64 and x64)
            # Self-hosted Mac mini; avoids the 10x macOS minute rate.
            runner: tau-macos
            platform: --mac --arm64 --x64
            artifact: macos
          - name: Linux x64
            runner: ubuntu-latest
            platform: --linux --x64
            artifact: linux
          - name: Windows x64
            runner: windows-latest
            # node-pty ships N-API binaries for Windows, which Electron loads as they are; rebuilding it
            # from source fails when node-gyp's Visual Studio lookup overflows its output buffer.
            platform: --win --x64 -c.npmRebuild=false
            artifact: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Before the build, so the app, its update feed and the file names all carry it.
      - name: Stamp the nightly version
        if: needs.gate.outputs.nightly == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: npm pkg set version="$VERSION"
      - run: npm run build

      - name: Package
        shell: bash
        env:
          # Signing turns itself on once these are set. electron-builder treats
          # an empty value as "set", so an unsigned build has to unset them.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization through the App Store Connect API key; the .p8 is written to a file below.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Makes electron-builder write release/builder-debug.yml, which is
          # otherwise silent; a failing platform is diagnosed from it.
          DEBUG: electron-builder
        run: |
          # The Developer ID certificate is Apple's; Windows would try it for Authenticode.
          if [ "${{ matrix.artifact }}" != "macos" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name-}" ] || unset "$name"
          done
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            key="$RUNNER_TEMP/notary-api-key.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            chmod 600 "$key"
            export APPLE_API_KEY="$key"
            unset APPLE_API_KEY_P8 APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          [ -n "${CSC_LINK:-}" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          status=0
          npx electron-builder ${{ matrix.platform }} --publish never || status=$?
          rm -f "$RUNNER_TEMP/notary-api-key.p8"
          exit "$status"

      # What apt installs and what DebUpdater downloads: Xvfb comes along, the
      # AppArmor profile is inside, and the feed names the package.
      - name: Check the .deb
        if: matrix.artifact == 'linux'
        shell: bash
        run: |
          deb="$(ls release/Tau_*_amd64.deb)"
          dpkg-deb --field "$deb" Package Version Depends Recommends
          # Listed first: grep -q closing the pipe would fail dpkg-deb under pipefail.
          files="$(dpkg-deb -c "$deb")"
          grep -q '\bxvfb\b' <<< "$(dpkg-deb --field "$deb" Recommends)"
          grep -q ' \./opt/Tau/resources/apparmor-profile$' <<< "$files"
          grep -q ' \./opt/Tau/bin/tau$' <<< "$files"
          # The update helper, the script it runs, and the polkit files postinst puts in place (docs/host-updates.md).
          paths="$(awk '{ print $NF }' <<< "$files")"
          for path in \
            ./opt/Tau/bin/tau-update-helper \
            ./opt/Tau/resources/app.asar.unpacked/bin/tau-update-helper.mjs \
            ./opt/Tau/resources/polkit/de.tbuck.tau.update.policy \
            ./opt/Tau/resources/polkit/50-tau-update.rules \
            ./opt/Tau/resources/polkit/50-tau-update.pkla; do
            grep -qxF "$path" <<< "$paths" || { echo "::error::The .deb lacks $path."; exit 1; }
          done
          grep -qF /usr/share/polkit-1/actions/de.tbuck.tau.update.policy <<< "$(dpkg-deb --info "$deb" postinst)"
          grep -q "url: $(basename "$deb")" release/latest-linux.yml

      - uses: actions/upload-artifact@v4
        with:
          name: tau-${{ matrix.artifact }}
          if-no-files-found: error
          # Consumed by the release job in this run; published files live in
          # the GitHub release. Long retention filled the account's storage.
          retention-days: 1
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.blockmap
            release/latest*.yml

      # The update feed alone, for the sign job; the installers stay in tau-<platform>.
      - uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1
          path: release/latest*.yml

      # electron-builder's debug log and npm's own log live outside `release/`
      # and are only worth keeping when something went wrong.
      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp release/builder-debug.yml diagnostics/ 2>/dev/null || true
          npm_cache="$(npm config get cache)"
          find "$npm_cache/_logs" -type f -name '*.log' -exec cp {} diagnostics/ \; 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tau-${{ matrix.artifact }}-diagnostics
          if-no-files-found: ignore
          path: diagnostics
          retention-days: 7

  # Signs every latest*.yml of the run with TAU_RELEASE_SIGNING_KEY; installed
  # hosts refuse a feed without the .sig (docs/host-updates.md). A dry run signs
  # too when the secret is there, and stays unsigned with a warning when not.
  sign:
    needs: [gate, build]
    runs-on: tau-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: feed-*
          path: feed
          merge-multiple: true
      - id: sign
        name: Sign the update feeds
        shell: bash
        env:
          TAU_RELEASE_SIGNING_KEY: ${{ secrets.TAU_RELEASE_SIGNING_KEY }}
          PUBLISHING: ${{ needs.gate.outputs.nightly == 'true' || startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
        run: |
          # One per platform of the matrix; a missing one leaves that platform without updates.
          for name in latest-mac.yml latest.yml latest-linux.yml; do
            [ -f "feed/$name" ] || { echo "::error::The builds wrote no $name."; exit 1; }
          done
          if [ -z "${TAU_RELEASE_SIGNING_KEY:-}" ]; then
            if [ "$PUBLISHING" = true ]; then
              echo "::error::The secret TAU_RELEASE_SIGNING_KEY is not set; refusing to publish unsigned update feeds."
              exit 1
            fi
            echo "::warning::The secret TAU_RELEASE_SIGNING_KEY is not set; this dry run is not signed."
            exit 0
          fi
          node scripts/packaging/release-signing.mjs sign feed/latest*.yml
          # Fails when the secret is not a key this commit's hosts trust.
          node scripts/packaging/release-signing.mjs check feed/latest*.yml
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tau-signatures
          if-no-files-found: error
          retention-days: 1
          path: feed/latest*.yml.sig

  # The release goes to two places: Rasalas/tau keeps it as it always had
  # (notes, tag, every file), and the public Rasalas/tau-releases carries the
  # same files and notes, which is where installed apps and install:mac read.
  release:
    needs: [gate, build, sign]
    if: needs.gate.outputs.nightly != 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
    runs-on: tau-linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tau-<platform> and tau-signatures; the feed-* copies are not needed again.
      - uses: actions/download-artifact@v4
        with:
          pattern: tau-*
          path: artifacts
          merge-multiple: true
      - name: Add the license
        run: cp LICENSE artifacts/LICENSE
      - name: List what will be published
        run: ls -lh artifacts
      - name: Require the release key's signature on every update feed
        run: node scripts/packaging/release-signing.mjs check artifacts/latest*.yml
      # The latest*.yml files are what electron-updater reads; a release without
      # them installs fine and then never updates.
      - name: Require every file the feeds name, their blockmaps and the license
        run: node scripts/packaging/publish-release.mjs check artifacts
      - id: source
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
      # GitHub writes the notes from this repository's history; tau-releases has none.
      - name: Take the notes along
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.source.outputs.id }}
        with:
          script: |
            const { releaseBody } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/packaging/publish-release.mjs`);
            const body = await releaseBody(github, { ...context.repo, releaseId: Number(process.env.RELEASE_ID) });
            require("node:fs").writeFileSync("release-notes.md", body);
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TAU_RELEASES_APP_ID }}
          private-key: ${{ secrets.TAU_RELEASES_APP_KEY }}
          owner: Rasalas
          repositories: tau-releases
          permission-contents: write
      # A draft first: installed apps keep seeing the previous release until
      # every file is up. Its tag lands on tau-releases' default branch.
      - id: public
        uses: softprops/action-gh-release@v2
        with:
          repository: Rasalas/tau-releases
          token: ${{ steps.token.outputs.token }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
      - name: Publish the public release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.public.outputs.id }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { PUBLIC_REPO, publishDraft, releaseFiles } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/packaging/publish-release.mjs`);
            const url = await publishDraft(github, { ...PUBLIC_REPO, releaseId: Number(process.env.RELEASE_ID), names: releaseFiles("artifacts"), latest: true });
            core.notice(`Published ${url}`);

  # One prerelease under the moving tag `nightly`, in both repositories: the
  # previous one and its tag go first, so no stale asset stays behind. The gate
  # reads Rasalas/tau's tag; an installed Tau on the nightly channel reads
  # tau-releases' latest*.yml.
  nightly:
    needs: [gate, build, sign]
    if: needs.gate.outputs.nightly == 'true'
    runs-on: tau-linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: tau-*
          path: artifacts
          merge-multiple: true
      - name: Add the license
        run: cp LICENSE artifacts/LICENSE
      - name: List what will be published
        run: ls -lh artifacts
      - name: Require the release key's signature on every update feed
        run: node scripts/packaging/release-signing.mjs check artifacts/latest*.yml
      - name: Require every file the feeds name, their blockmaps and the license
        run: node scripts/packaging/publish-release.mjs check artifacts
      - name: Remove the previous nightly
        uses: actions/github-script@v7
        with:
          script: |
            const { removeNightly } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/packaging/publish-release.mjs`);
            await removeNightly(github, context.repo);
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly ${{ needs.gate.outputs.version }}
          body: |
            Built from ${{ github.sha }} on main. Nightly builds are untested; Settings → Defaults → Update track switches an installed Tau between Stable and Nightly.
          prerelease: true
          make_latest: false
          files: artifacts/*
          fail_on_unmatched_files: true
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TAU_RELEASES_APP_ID }}
          private-key: ${{ secrets.TAU_RELEASES_APP_KEY }}
          owner: Rasalas
          repositories: tau-releases
          permission-contents: write
      - name: Remove the previous public nightly
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { PUBLIC_REPO, removeNightly } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/packaging/publish-release.mjs`);
            await removeNightly(github, PUBLIC_REPO);
      # No target_commitish: the source commit does not exist in tau-releases,
      # so the tag lands on its default branch and the body names the commit.
      - id: public
        uses: softprops/action-gh-release@v2
        with:
          repository: Rasalas/tau-releases
          token: ${{ steps.token.outputs.token }}
          tag_name: nightly
          name: Nightly ${{ needs.gate.outputs.version }}
          body: |
            Built from ${{ github.sha }} on main. Nightly builds are untested; Settings → Defaults → Update track switches an installed Tau between Stable and Nightly.
          prerelease: true
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
      - name: Publish the public nightly
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.public.outputs.id }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { PUBLIC_REPO, publishDraft, releaseFiles } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/packaging/publish-release.mjs`);
            const url = await publishDraft(github, { ...PUBLIC_REPO, releaseId: Number(process.env.RELEASE_ID), names: releaseFiles("artifacts"), latest: false });
            core.notice(`Published ${url}`);
