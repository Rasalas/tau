name: Cleanup artifacts

# Artifacts count against the account's storage quota. Anything older than
# two days has served its purpose; release files live in the GitHub release.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: cleanup-artifacts
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: tau-linux
    timeout-minutes: 5
    steps:
      - name: Delete artifacts older than two days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 2 * 24 * 60 * 60 * 1000;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            let deleted = 0;
            for (const artifact of artifacts) {
              if (artifact.expired || Date.parse(artifact.created_at) >= cutoff) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`deleted artifact ${artifact.id} (${artifact.name})`);
              deleted += 1;
            }
            core.info(`deleted ${deleted} artifacts older than two days`);
