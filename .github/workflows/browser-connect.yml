name: Browser Connect adapter

on:
  pull_request:
    paths:
      - browser-connect/**
      - src/web/connect/**
      - scripts/build-browser-connect.mjs
      - vite/browser-connect.test.ts
      - .github/workflows/browser-connect.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-connect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    # The committed package is this runner's build; other build hosts lay out the code differently.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install adapter tools
        run: |
          sdk=wasi-sdk-27.0-x86_64-linux
          curl --fail --location --silent --show-error "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-27/$sdk.tar.gz" -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          echo "b7d4d944c88503e4f21d84af07ac293e3440b1b6210bfd7fe78e0afd92c23bc2  $RUNNER_TEMP/wasi-sdk.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/$sdk" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.98.1 install wasm-bindgen-cli --version 0.2.129 --locked --jobs 2
      - name: Rebuild locked Rust source and verify its transport
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          npm run build:browser-connect
          git diff --exit-code -- browser-connect/pkg
          npm test -- src/web/connect vite/browser-connect.test.ts --maxWorkers=2
      - name: Keep the rebuilt package, the source of a new pkg/
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-connect-pkg
          path: |
            browser-connect/pkg
            browser-connect/target/wasm32-unknown-unknown/release/tau_browser_connect.wasm
          retention-days: 7
