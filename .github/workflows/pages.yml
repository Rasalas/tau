name: Website

# The landing page (site/) and the docs rendered from the repository's Markdown,
# on GitHub Pages. Pages needs a public repository on the free plan: until the
# source goes public this workflow is ready but has nowhere to deploy.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'examples/review-button/**'
      - 'scripts/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A hosted runner: nothing here needs the private host, and a fork never deploys.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The docs build needs only the Markdown packages; no install scripts, no Electron download.
      - run: npm ci --ignore-scripts
      - run: npm run site:docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
