name: Website

# The landing page (site/) and the docs rendered from the repository's Markdown,
# on GitHub Pages. Pages needs a public repository on the free plan.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'examples/review-button/**'
      - 'scripts/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# A deployment that already started finishes; the newest waiting one follows.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A fork's Pages would publish a copy of the site under its own name.
    if: github.repository == 'Rasalas/tau'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # The docs build needs only the Markdown packages; no install scripts, no Electron download.
      - run: npm ci --ignore-scripts
      - run: npm run site:docs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  # Only this job may write to Pages; it runs no repository code.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
