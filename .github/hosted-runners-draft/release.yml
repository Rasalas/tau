name: Release

on:
  push:
    tags: ["v*.*.*"]
  # The nightly: 03:17 UTC, published only when main moved since the last one,
  # and only once the repository variable NIGHTLY is `true` (docs/RELEASE.md).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release from a tag ref (otherwise just build and upload artifacts)
        type: boolean
        default: false
      nightly:
        description: Build main and publish it as the nightly prerelease now, even without new commits
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Write access only where a release is made (release, nightly).
permissions:
  contents: read

jobs:
  # Decides whether this run builds at all, and whether it is a nightly.
  gate:
    # A fork runs schedules too; only upstream publishes nightlies, once switched on.
    if: github.event_name != 'schedule' || (github.repository == 'Rasalas/tau' && vars.NIGHTLY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      nightly: ${{ steps.decide.outputs.nightly }}
      version: ${{ steps.decide.outputs.version }}
      # Publishing runs get the protected environment; dry runs one without secrets.
      environment: ${{ steps.decide.outputs.environment }}
    steps:
      # Credentials kept: `git ls-remote origin` below. Trusted events only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          NIGHTLY: ${{ inputs.nightly }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" != schedule ] && [ "$NIGHTLY" != true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "nightly=false" >> "$GITHUB_OUTPUT"
            case "$REF" in
              refs/tags/v*) echo "environment=release" >> "$GITHUB_OUTPUT" ;;
              *) if [ "$PUBLISH" = true ]; then echo "environment=release"; else echo "environment=release-dry-run"; fi >> "$GITHUB_OUTPUT" ;;
            esac
            exit 0
          fi
          if [ "$PUBLISH" = true ]; then
            echo "::error::publish and nightly exclude each other."
            exit 1
          fi
          if [ "$REF" != refs/heads/main ] || [ "$REPOSITORY" != Rasalas/tau ]; then
            echo "::error::A nightly builds main of Rasalas/tau, not $REF of $REPOSITORY."
            exit 1
          fi
          echo "environment=release" >> "$GITHUB_OUTPUT"
          head="$(git rev-parse HEAD)"
          # The peeled line (^{}) names the commit when the tag is annotated.
          last="$(git ls-remote origin refs/tags/nightly 'refs/tags/nightly^{}' | tail -n 1 | cut -f 1)"
          if [ "$EVENT" = schedule ] && [ "$last" = "$head" ]; then
            echo "main is still at the last nightly ($head); nothing to publish."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "nightly=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(node scripts/packaging/nightly-version.mjs --run "$RUN_NUMBER")"
          echo "Nightly $version from $head (last nightly: ${last:-none})."
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "nightly=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Same gates as ci.yml, so a tag on a red commit stops here.
  verify:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ needs.gate.outputs.environment }}
    timeout-minutes: 45
    steps:
      - name: Require a tag ref for publishing
        if: inputs.publish && github.ref_type != 'tag'
        run: |
          echo "::error::Publishing requires a tag ref. Dispatch this workflow on a tag, or set publish=false."
          exit 1
      # Installed hosts refuse an unsigned feed; fail before the builds.
      - name: Require the release signing key for publishing
        if: needs.gate.outputs.nightly == 'true' || startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          HAS_KEY: ${{ secrets.TAU_RELEASE_SIGNING_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::The secret TAU_RELEASE_SIGNING_KEY is not set; a release without signed update feeds would be refused by every installed Tau."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run

  build:
    needs: [gate, verify]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    environment: ${{ needs.gate.outputs.environment }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Mac architectures on one runner, so they write a single latest-mac.yml.
          # macos-26 is arm64 and ships Xcode 26 (actool for assets/icon/Tau.icon).
          - name: macOS (arm64 and x64)
            runner: macos-26
            platform: --mac --arm64 --x64
            artifact: macos
          - name: Linux x64
            runner: ubuntu-24.04
            platform: --linux --x64
            artifact: linux
          - name: Windows x64
            runner: windows-2025
            # node-pty's N-API binaries load as they are; a node-gyp rebuild fails on the runner.
            platform: --win --x64 -c.npmRebuild=false
            artifact: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Pinned so an image update cannot move the Icon Composer compiler under a release.
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun actool --version
      # Electron and electron-builder download these on first use; npm's cache does not hold them.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      # Before the build, so the app, its update feed and the file names all carry it.
      - name: Stamp the nightly version
        if: needs.gate.outputs.nightly == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: npm pkg set version="$VERSION"
      - run: npm run build

      - name: Package
        shell: bash
        env:
          # electron-builder imports CSC_LINK into a temporary keychain it deletes after the build.
          # An empty value counts as "set", so an unsigned build unsets them.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Writes release/builder-debug.yml, from which a failing platform is diagnosed.
          DEBUG: electron-builder
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name-}" ] || unset "$name"
          done
          [ -n "${CSC_LINK:-}" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder ${{ matrix.platform }} --publish never

      # What apt installs and what DebUpdater downloads.
      - name: Check the .deb
        if: matrix.artifact == 'linux'
        shell: bash
        run: |
          deb="$(ls release/Tau_*_amd64.deb)"
          dpkg-deb --field "$deb" Package Version Depends Recommends
          # Listed first: grep -q closing the pipe would fail dpkg-deb under pipefail.
          files="$(dpkg-deb -c "$deb")"
          grep -q '\bxvfb\b' <<< "$(dpkg-deb --field "$deb" Recommends)"
          grep -q ' \./opt/Tau/resources/apparmor-profile$' <<< "$files"
          grep -q ' \./opt/Tau/bin/tau$' <<< "$files"
          # The update helper, its script and the polkit files (docs/host-updates.md).
          paths="$(awk '{ print $NF }' <<< "$files")"
          for path in \
            ./opt/Tau/bin/tau-update-helper \
            ./opt/Tau/resources/app.asar.unpacked/bin/tau-update-helper.mjs \
            ./opt/Tau/resources/polkit/de.tbuck.tau.update.policy \
            ./opt/Tau/resources/polkit/50-tau-update.rules \
            ./opt/Tau/resources/polkit/50-tau-update.pkla; do
            grep -qxF "$path" <<< "$paths" || { echo "::error::The .deb lacks $path."; exit 1; }
          done
          grep -qF /usr/share/polkit-1/actions/de.tbuck.tau.update.policy <<< "$(dpkg-deb --info "$deb" postinst)"
          grep -q "url: $(basename "$deb")" release/latest-linux.yml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tau-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.blockmap
            release/latest*.yml

      # The update feed alone, for the sign job.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feed-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1
          path: release/latest*.yml

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp release/builder-debug.yml diagnostics/ 2>/dev/null || true
          npm_cache="$(npm config get cache)"
          find "$npm_cache/_logs" -type f -name '*.log' -exec cp {} diagnostics/ \; 2>/dev/null || true

      # Public on a public repository: check builder-debug.yml holds no secret before going public.
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tau-${{ matrix.artifact }}-diagnostics
          if-no-files-found: ignore
          path: diagnostics
          retention-days: 7

  # Signs every latest*.yml with TAU_RELEASE_SIGNING_KEY (docs/host-updates.md).
  sign:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    environment: ${{ needs.gate.outputs.environment }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: feed-*
          path: feed
          merge-multiple: true
      - id: sign
        name: Sign the update feeds
        shell: bash
        env:
          TAU_RELEASE_SIGNING_KEY: ${{ secrets.TAU_RELEASE_SIGNING_KEY }}
          PUBLISHING: ${{ needs.gate.outputs.nightly == 'true' || startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
        run: |
          for name in latest-mac.yml latest.yml latest-linux.yml; do
            [ -f "feed/$name" ] || { echo "::error::The builds wrote no $name."; exit 1; }
          done
          if [ -z "${TAU_RELEASE_SIGNING_KEY:-}" ]; then
            if [ "$PUBLISHING" = true ]; then
              echo "::error::The secret TAU_RELEASE_SIGNING_KEY is not set; refusing to publish unsigned update feeds."
              exit 1
            fi
            echo "::warning::The secret TAU_RELEASE_SIGNING_KEY is not set; this dry run is not signed."
            exit 0
          fi
          node scripts/packaging/release-signing.mjs sign feed/latest*.yml
          # Fails when the secret is not a key this commit's hosts trust.
          node scripts/packaging/release-signing.mjs check feed/latest*.yml
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tau-signatures
          if-no-files-found: error
          retention-days: 1
          path: feed/latest*.yml.sig

  release:
    needs: [gate, build, sign]
    if: needs.gate.outputs.nightly != 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tau-*
          path: artifacts
          merge-multiple: true
      - name: List what will be published
        run: ls -lh artifacts
      - name: Require the release key's signature on every update feed
        run: node scripts/packaging/release-signing.mjs check artifacts/latest*.yml
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # One prerelease under the moving tag `nightly`; the previous one and its tag go first.
  nightly:
    needs: [gate, build, sign]
    if: needs.gate.outputs.nightly == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tau-*
          path: artifacts
          merge-multiple: true
      - name: List what will be published
        run: ls -lh artifacts
      - name: Require the release key's signature on every update feed
        run: node scripts/packaging/release-signing.mjs check artifacts/latest*.yml
      - name: Remove the previous nightly
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: "nightly" });
              if (!data.prerelease) throw new Error("The release tagged nightly is not a prerelease; refusing to delete it.");
              await github.rest.repos.deleteRelease({ owner, repo, release_id: data.id });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: "tags/nightly" });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly ${{ needs.gate.outputs.version }}
          body: |
            Built from ${{ github.sha }} on main. Nightly builds are untested; Settings → Defaults → Update track switches an installed Tau between Stable and Nightly.
          prerelease: true
          make_latest: false
          files: artifacts/*
          fail_on_unmatched_files: true
