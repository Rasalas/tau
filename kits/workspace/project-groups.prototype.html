<main class="page"><div class="eyebrow">Tau / Projektgruppen / Interaktiver Entwurf</div><div class="intro"><div><h1 id="title"></h1><p id="subtitle"></p></div><span class="counter"><b id="number"></b> / 03</span></div><div class="study"><section class="window" aria-label="Tau Workbench Vorschau"><aside class="rail" id="rail"></aside><section class="conversation" id="conversation"></section></section><aside class="note" id="note"></aside></div></main>
<nav class="switcher" aria-label="Entwurf wechseln"><span class="prototype">Entwürfe</span><button class="arrow" onclick="cycle(-1)" aria-label="Vorheriger Entwurf"><svg><use href="#left"/></svg></button><button data-variant="A" onclick="switchVariant('A')">A · Filtermenü</button><button data-variant="B" onclick="switchVariant('B')">B · Favoriten</button><button data-variant="C" onclick="switchVariant('C')">C · Gruppenbaum</button><button class="arrow" onclick="cycle(1)" aria-label="Nächster Entwurf"><svg><use href="#right"/></svg></button></nav>
<script>
const projects=[{id:'tau',name:'Tau',color:'#91abea',initial:'τ'},{id:'site',name:'Website',color:'#c7a1e5',initial:'W'},{id:'relay',name:'Relay',color:'#e8b184',initial:'R'},{id:'studio',name:'Studio',color:'#86c8b0',initial:'S'},{id:'none',name:'Ohne Projekt',color:'#9ca2af',initial:'·'}];
const threads=[{project:'tau',title:'Projektfilter erweitern',time:'jetzt',status:'Aktiv',active:true},{project:'site',title:'Startseite überarbeiten',time:'4m',status:'Aktiv'},{project:'tau',title:'Tastaturkürzel vereinheitlichen',time:'12m',status:'Aktiv'},{project:'relay',title:'Verbindung nach Standby',time:'18m',status:'Aktiv'},{project:'studio',title:'Angebot für Oktober',time:'31m',status:'Aktiv'},{project:'none',title:'Ideen fürs Wochenende',time:'1h',status:'Aktiv'},{project:'tau',title:'Release vorbereiten',time:'2h',status:'Working'},{project:'site',title:'Bilder für die Dokumentation',time:'3h',status:'Snoozed'},{project:'studio',title:'Rechnung September',time:'1d',status:'Settled'}];
const variants={A:{title:'Die Gruppe bleibt im Filter.',subtitle:'Mehrere Projekte auswählen, als Ansicht speichern und über dasselbe Menü wieder aufrufen.',name:'Wenig zusätzliche Oberfläche',text:'Das bestehende Filtermenü bekommt Checkboxen und gespeicherte Ansichten. Oben bleibt nur <strong>„Produkt · 2“</strong> sichtbar.',benefit:'Mein Favorit für Tau. Funktioniert auch bei vielen gespeicherten Gruppen, ohne die Sidebar zu verlängern.',cost:'Der Wechsel zu einer anderen Gruppe braucht zwei Klicks.'},B:{title:'Häufige Gruppen direkt im Blick.',subtitle:'Eine kleine Favoritenleiste unter der Suche. Ein Klick wechselt den Projektfilter.',name:'Schnell zwischen Themen wechseln',text:'Gespeicherte Ansichten stehen als Chips unter der Suche. Darunter sieht man die enthaltenen Projekte. Das <strong>Plus</strong> öffnet die Mehrfachauswahl.',benefit:'Gut, wenn du täglich zwischen zwei bis vier Gruppen wechselst. Der aktive Filter ist sofort lesbar.',cost:'Kostet dauerhaft Platz. Bei vielen Favoriten muss die Leiste horizontal scrollen.'},C:{title:'Gruppen als feste Navigation.',subtitle:'Gespeicherte Gruppen bekommen einen eigenen Bereich. Die enthaltenen Projekte lassen sich direkt ansteuern.',name:'Mehr Struktur in der Sidebar',text:'Ein Gruppenbaum steht über den Threads. Klick auf <strong>„Produkt“</strong> zeigt die ganze Gruppe, Klick auf ein Projekt nur dessen Threads.',benefit:'Gut, wenn Projektgruppen dauerhaft deine Arbeit organisieren und du ihre Zusammensetzung sehen möchtest.',cost:'Beansprucht am meisten Höhe. Überlappende Gruppen können dieselben Projekte mehrfach zeigen.'}};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants[variant])variant='A';
let groups=[{id:'product',name:'Produkt',ids:['tau','site']},{id:'client',name:'Kunden',ids:['studio','site']}];
let selected=['tau','site'],activeGroup='product',menu=variant==='A'?'filter':null,query='',saving=false,draft=null,activeThread=threads[0];
const $=s=>document.querySelector(s),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;
const tile=id=>{const p=projects.find(p=>p.id===id);return `<i class="tile" style="--project-color:${p.color};font-style:normal">${p.initial}</i>`};
const group=()=>groups.find(g=>g.id===activeGroup);
const selectionName=()=>group()?.name||(selected.length===projects.length?'Alle Projekte':selected.length===1?projects.find(p=>p.id===selected[0]).name:`${selected.length} Projekte`);
const matches=()=>threads.filter(t=>selected.includes(t.project));
function render(){const v=variants[variant];$('#title').textContent=v.title;$('#subtitle').textContent=v.subtitle;$('#number').textContent='0'+(Object.keys(variants).indexOf(variant)+1);document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));renderRail();renderConversation();$('#note').innerHTML=`<span class="badge ${variant==='A'?'recommended':''}">${variant==='A'?'Meine Empfehlung':'Alternative '+variant}</span><h2>${v.name}</h2><div class="description"><p>${v.text}</p><p>${v.benefit}</p><p>${v.cost}</p></div><div class="try"><p><strong>Ausprobieren</strong><br>Projekte auswählen, eine Ansicht speichern und einen neuen Thread starten.</p><button onclick="openMenu('filter')">Mehrfachauswahl</button><button onclick="singleProject()">Nur Tau anzeigen</button><button onclick="newThread()">Neuer Thread</button><button onclick="reset()">Zurücksetzen</button></div><div class="state" aria-live="polite">Entwurfszustand · nur für diese Vorschau<span>Ansicht: ${escape(selectionName())}</span><span>Projekte: ${selected.map(id=>escape(projects.find(p=>p.id===id).name)).join(', ')||'keine'}</span><span>Sichtbar: ${matches().length} von ${threads.length} Threads</span><span>Neuer Thread: ${selected.length===1?'direkt in '+escape(selectionName()):'Projekt auswählen'}</span><span>Gespeichert: ${groups.map(g=>escape(g.name)).join(', ')}</span></div>`}
function renderRail(){const shown=matches();let controls=`<div class="search-row"><div class="search">${icon('search')}<span>Threads suchen</span></div>${variant==='A'?`<button class="filter" onclick="openMenu('filter')" aria-expanded="${menu==='filter'}" aria-label="Projekte filtern">${icon(group()?'layers':'folder')}<span>${escape(selectionName())}${group()?' · '+selected.length:''}</span>${icon('down')}</button>`:''}<button class="icon new" onclick="newThread()" aria-label="Neuer Thread">${icon('plus')}</button></div>`;
if(variant==='B')controls+=`<div class="chips" aria-label="Gespeicherte Ansichten"><button class="${selected.length===projects.length?'on':''}" onclick="selectAll()">Alle</button>${groups.map(g=>`<button class="${activeGroup===g.id?'on':''}" onclick="chooseGroup('${g.id}')">${escape(g.name)} <small>${g.ids.length}</small></button>`).join('')}<button onclick="openMenu('filter')" aria-label="Ansicht erstellen oder ändern">${icon('plus')}</button></div><div class="selection-hint">${selected.slice(0,3).map(tile).join('')}<span>${selected.length} Projekte</span><button onclick="openMenu('filter')">Bearbeiten</button></div>`;
if(variant==='C')controls+=`<div class="group-tree"><div class="tree-label">GESPEICHERTE ANSICHTEN<button onclick="openMenu('filter')" aria-label="Ansicht hinzufügen">${icon('plus')}</button></div><button class="group-row ${selected.length===projects.length?'on':''}" onclick="selectAll()">${icon('folder')}<span>Alle Projekte</span><small>${projects.length}</small></button>${groups.map(g=>`<button class="group-row ${activeGroup===g.id?'on':''}" onclick="chooseGroup('${g.id}')">${icon(activeGroup===g.id?'down':'right')}${icon('layers')}<span>${escape(g.name)}</span><small>${g.ids.length}</small></button>${activeGroup===g.id?`<div class="group-children">${g.ids.map(id=>`<button onclick="chooseProject('${id}')">${tile(id)}${escape(projects.find(p=>p.id===id).name)}<small>${threads.filter(t=>t.project===id).length}</small></button>`).join('')}</div>`:''}`).join('')}<button class="group-row" onclick="openMenu('filter')">${icon('plus')}<span>Auswahl zusammenstellen</span></button></div>`;
$('#rail').innerHTML=`<div class="window-head"><i class="light"></i><i class="light"></i><i class="light"></i><span class="app-name">Tau</span></div><div class="controls">${controls}</div><nav class="threads" aria-label="Threads">${['Aktiv','Working','Snoozed','Settled'].map(status=>{const list=shown.filter(t=>t.status===status);return list.length?`<div class="section-label">${status}<small>${list.length}</small></div>${list.map(t=>`<button class="thread ${!draft&&activeThread===t?'active':''}" onclick="chooseThread(${threads.indexOf(t)})">${tile(t.project)}<span class="title"><strong>${escape(t.title)}</strong><small>${escape(projects.find(p=>p.id===t.project).name)}</small></span>${status==='Working'?'<i class="dot"></i>':''}<time>${t.time}</time></button>`).join('')}`:''}).join('')}${shown.length?'':'<p class="empty">Keine Threads in dieser Auswahl.</p>'}</nav><footer class="rail-bottom">${icon('settings')}<span>Einstellungen</span><small>MacBook Pro</small></footer>${menu?'<button class="scrim" onclick="closeMenu()" aria-label="Menü schließen"></button>'+renderMenu():''}`;
}
function renderMenu(){if(menu==='new')return `<section class="popover new-picker" role="dialog" aria-label="Projekt für neuen Thread"><div class="menu-heading">NEUER THREAD</div><p class="filter-note">In welchem Projekt möchtest du starten?</p>${(selected.length?selected:projects.map(p=>p.id)).map(id=>`<button class="menu-item" onclick="startDraft('${id}')">${tile(id)}<span class="label">${escape(projects.find(p=>p.id===id).name)}</span>${icon('right')}</button>`).join('')}<div class="menu-footer"><button onclick="closeMenu()">Abbrechen</button></div></section>`;
return `<section class="popover" role="dialog" aria-label="Projekte filtern"><label class="menu-search">${icon('search')}<input id="project-query" aria-label="Projekte suchen" placeholder="Projekte suchen …" value="${escape(query)}" oninput="searchProjects(this.value)"></label><div class="menu-heading">GESPEICHERTE ANSICHTEN</div>${groups.map(g=>`<button class="menu-item ${activeGroup===g.id?'current':''}" onclick="chooseGroup('${g.id}')">${icon('layers')}<span class="label">${escape(g.name)}<small>${g.ids.map(id=>escape(projects.find(p=>p.id===id).name)).join(' · ')}</small></span>${activeGroup===g.id?icon('check'):`<small>${g.ids.length}</small>`}</button>`).join('')}<div class="menu-heading">PROJEKTE <span>Mehrfachauswahl</span></div><button class="menu-item" onclick="selectAll(false)">${icon('folder')}<span class="label">Alle Projekte</span>${selected.length===projects.length?icon('check'):''}</button><div id="project-options">${projectOptions()}</div><div class="menu-footer">${saving?`<form class="save-form" onsubmit="saveGroup(event)"><input id="group-name" aria-label="Name der Ansicht" placeholder="Name der Ansicht" maxlength="40" required><button type="submit">Speichern</button></form>`:`<button class="save" onclick="beginSave()" ${selected.length?'':'disabled'}>${icon('bookmark')}Als neue Ansicht speichern …</button>`}<button class="finish" onclick="closeMenu()">Fertig · ${selected.length} ${selected.length===1?'Projekt':'Projekte'}</button></div></section>`}
function projectOptions(){const list=projects.filter(p=>p.name.toLocaleLowerCase().includes(query.toLocaleLowerCase()));return list.map(p=>`<button class="menu-item" role="checkbox" aria-checked="${selected.includes(p.id)}" onclick="toggleProject('${p.id}')"><i class="check ${selected.includes(p.id)?'checked':''}">${selected.includes(p.id)?icon('check'):''}</i>${tile(p.id)}<span class="label">${escape(p.name)}</span><small>${threads.filter(t=>t.project===p.id).length}</small></button>`).join('')||'<p class="empty">Kein passendes Projekt</p>'}
function renderConversation(){const p=projects.find(p=>p.id===(draft||activeThread.project));$('#conversation').innerHTML=`<header class="chat-head"><span>${tile(p.id)}${escape(p.name)}</span><span>${draft?'Neuer Thread':'main'} ${icon('down')}</span></header>${draft?`<div class="chat draft"><span class="draft-label">${tile(p.id)}${escape(p.name)}</span><h2>Woran arbeiten wir?</h2><p>Der neue Thread startet in ${escape(p.name)}.<br>Du kannst das Projekt vor der ersten Nachricht wechseln.</p><button onclick="openMenu('new')">Projekt wechseln</button></div>`:`<div class="chat"><h2>${escape(activeThread.title)}</h2><div class="bubble">${activeThread===threads[0]?'Ich möchte Tau und die Website zusammen sehen, während ich am nächsten Release arbeite.':'Lass uns an diesem Thema weiterarbeiten.'}</div><div class="response"><p>${activeThread===threads[0]?'Die Ansicht „Produkt“ zeigt Threads aus Tau und Website. Beide Projekte bleiben eigenständig.':'Die ausgewählte Unterhaltung bleibt hier geöffnet.'}</p><p>Die Projektauswahl links filtert deine Threadliste. Eine andere Ansicht öffnet keinen anderen Thread.</p><div class="code">${activeThread===threads[0]?'Tau + Website → Produkt':escape(p.name)+' → '+escape(activeThread.title)}</div></div></div>`}<div class="composer"><textarea aria-label="Nachricht im Entwurf" placeholder="${draft?'Eine Aufgabe für '+escape(p.name)+' …':'Nachricht an den Agenten …'}"></textarea><footer>${icon('plus')}<small>Codex</small><span></span><small>Vorschau</small><i class="icon">${icon('send')}</i></footer></div>`}
function toggleProject(id){selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];activeGroup=null;render()}
function chooseGroup(id){const g=groups.find(g=>g.id===id);selected=[...g.ids];activeGroup=id;menu=null;query='';saving=false;render()}
function chooseProject(id){selected=[id];activeGroup=null;menu=null;render()}
function chooseThread(i){activeThread=threads[i];draft=null;render()}
function selectAll(close=true){selected=projects.map(p=>p.id);activeGroup=null;if(close)menu=null;render()}
function openMenu(which){menu=which;query='';saving=false;render();if(which==='filter')$('#project-query')?.focus();else document.querySelector('.popover button')?.focus()}
function closeMenu(){menu=null;saving=false;render()}
function searchProjects(value){query=value;$('#project-options').innerHTML=projectOptions()}
function beginSave(){saving=true;render();$('#group-name').focus()}
function saveGroup(event){event.preventDefault();const name=$('#group-name').value.trim();if(!name)return;const g={id:'view'+Date.now(),name,ids:[...selected]};groups.push(g);activeGroup=g.id;menu=null;saving=false;render()}
function newThread(){if(selected.length===1)startDraft(selected[0]);else openMenu('new')}
function startDraft(id){draft=id;menu=null;render()}
function singleProject(){chooseProject('tau')}
function reset(){groups=[{id:'product',name:'Produkt',ids:['tau','site']},{id:'client',name:'Kunden',ids:['studio','site']}];selected=['tau','site'];activeGroup='product';menu=variant==='A'?'filter':null;query='';saving=false;draft=null;activeThread=threads[0];render()}
function switchVariant(value){variant=value;const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState({},'',url);reset()}
function cycle(direction){const ids=Object.keys(variants);switchVariant(ids[(ids.indexOf(variant)+direction+ids.length)%ids.length])}
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'}
addEventListener('keydown',e=>{if(e.key==='Escape'&&menu){closeMenu();return}if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
render();
</script>
</html>
