[package]
name = "tau-browser-connect"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustls = { version = "0.23.35", default-features = false, features = ["std", "ring"] }
ring = { version = "0.17.14", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1.15", features = ["web"] }
wasm-bindgen = "0.2.105"
js-sys = "0.3.82"
x509-parser = "0.18.0"
sha2 = "0.10.9"
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
